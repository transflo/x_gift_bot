# 仅本地演示用，不要提交到生产部署。
#
# 生产环境里 HTTPS 由宿主机反向代理负责，容器只监听 127.0.0.1。
# 本地试跑时没有反代，而 XGIFT_ORIGIN 强制 https，浏览器直接访问
# http://127.0.0.1:8787 会让所有 POST 被 CSRF 拦截，所以这里补一个
# 带内部证书的 Caddy，在 https://localhost:8443 上提供同样的入口。
#
# 不需要本地试跑时删掉本文件即可，docker compose 会回到默认行为。
services:
  xgift:
    environment:
      XGIFT_ORIGIN: https://localhost:8443

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      - ./deploy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      xgift:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
